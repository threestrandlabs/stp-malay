<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belajar Bahasa Melayu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23f7f4ee'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='%232f5d4f' font-family='Georgia,serif'%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1 class="brand">Belajar Bahasa Melayu</h1>
  <div class="picker-row">
    <label class="visually-hidden" for="set-select">Choose a set</label>
    <select id="set-select" class="set-select"></select>
    <span id="term-count" class="term-count"></span>
  </div>
  <nav class="mode-row" id="mode-row" aria-label="Study mode">
    <button type="button" class="mode-btn" data-mode="flashcards" aria-pressed="false">Flashcards</button>
    <button type="button" class="mode-btn" data-mode="quiz" aria-pressed="false">Quiz</button>
    <button type="button" class="mode-btn" data-mode="conversation" aria-pressed="false">Conversation</button>
    <button type="button" class="mode-btn" data-mode="table" aria-pressed="false">Table</button>
  </nav>
</header>

<main id="view" class="view"></main>

<template id="tpl-icon-chevron-left"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></template>
<template id="tpl-icon-chevron-right"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></template>
<template id="tpl-icon-shuffle"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg></template>
<template id="tpl-icon-rotate"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg></template>
<template id="tpl-icon-check"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></template>
<template id="tpl-icon-x"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></template>
<template id="tpl-icon-search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></template>

<script src="js/app.js"></script>
</body>
</html>
